<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>3310 攻略目錄</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f1e3;--bg-2:#efe6d2;--card:#fffaf0;--text:#2e2a24;--muted:#5c5448;--faint:#8c8273;--line:#ddd1b9;--line-2:#c9b994;--core:#b0532c;--core-l:#f6e1d3;--air:#8e2f3b;--dark:#2e2a24}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans TC",system-ui,sans-serif;font-size:16.5px;line-height:1.85;overflow-x:hidden}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 48px}
.hero{text-align:center;padding:48px 0 20px}
.eyebrow{font-size:12px;letter-spacing:.4em;color:var(--core);font-weight:700}
h1{font-size:clamp(28px,7vw,40px);font-weight:900;letter-spacing:.04em;margin:12px 0 4px;line-height:1.35}
h1 .no{color:var(--core)}
.orn{display:flex;align-items:center;gap:12px;max-width:220px;margin:14px auto;color:var(--core);font-size:11px}
.orn::before,.orn::after{content:"";flex:1;height:1px;background:var(--line-2)}
.sub{color:var(--faint);font-size:14px;margin:0}
.tools{margin:8px 0 12px}
#q{width:100%;min-height:48px;padding:0 16px;border-radius:999px;border:1px solid var(--line-2);background:var(--card);color:var(--text);font:inherit;font-size:16px;outline:none}
#q:focus{border-color:var(--core)}
.cats{display:flex;gap:6px;overflow-x:auto;margin:12px 0 6px;scrollbar-width:none;justify-content:flex-start}
.cats::-webkit-scrollbar{display:none}
.cats button{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line-2);background:transparent;color:var(--muted);font:inherit;font-size:14px;white-space:nowrap;cursor:pointer}
.cats button.on{background:var(--core);border-color:var(--core);color:#fff;font-weight:700}
.count{font-size:13px;color:var(--faint);letter-spacing:.1em;padding-bottom:8px;border-bottom:3px solid var(--dark)}
.card{display:grid;grid-template-columns:18px 1fr;gap:10px;text-decoration:none;color:inherit;padding:18px 0;border-bottom:1px solid var(--line)}
.card:hover h2{color:var(--core)}
.dia{color:var(--core);font-size:10px;padding-top:9px}
.meta{display:flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.14em;color:var(--core);font-weight:700}
.new{background:var(--core-l);color:var(--core);padding:0 8px;border-radius:999px;letter-spacing:.06em}
.card h2{font-size:20px;font-weight:900;letter-spacing:.03em;margin:4px 0;line-height:1.45;transition:color .2s}
.card p{margin:0;font-size:14.5px;color:var(--muted)}
.date{margin-top:6px;font-size:13px;color:var(--faint)}
.empty{color:var(--faint);text-align:center;padding:32px 0}
footer{text-align:center;color:var(--faint);font-size:13px;padding:24px 0}
</style>
</head>
<body>
<main class="wrap">
<header class="hero"><div class="eyebrow">LAST WAR・攻略</div><h1><span class="no">3310</span> 攻略目錄</h1><div class="orn">◆</div><p class="sub">點擊標題進入攻略</p></header>
<div class="tools"><input id="q" type="search" placeholder="搜尋標題、關鍵字" aria-label="搜尋攻略"><div class="cats" id="cats"></div><div class="count" id="count"></div></div><div id="list" class="list"></div>
</main>
<footer>LAST WAR 攻略・3310</footer>
<script>
(function(){
  var DATA=[{"file": "tank-vs-air.html", "title": "坦克隊反制飛機隊完整攻略", "category": "", "summary": "飛機隊弱點分析、金柏莉前排戰術、亞當與盧修斯混隊、裝備分配、無人機晶片、職業技能、科技研究及競技場防守。", "keywords": "坦克 飛機 金柏莉 亞當 盧修斯 晶片 科技 競技場", "updated": "2026-10-26", "order": 10}], NEW_DAYS=14, prefix="";
  var list=document.getElementById('list'),q=document.getElementById('q'),cats=document.getElementById('cats'),count=document.getElementById('count');
  var cur='全部';
  function isNew(d){var t=new Date(d+'T00:00:00');return (Date.now()-t.getTime())/864e5<=NEW_DAYS}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  var names=['全部'];DATA.forEach(function(d){if(d.category&&names.indexOf(d.category)<0)names.push(d.category)});if(names.length<2)cats.style.display='none';
  cats.innerHTML=names.map(function(n){return '<button type="button" data-c="'+esc(n)+'">'+esc(n)+'</button>'}).join('');
  cats.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;cur=b.dataset.c;render()});
  q.addEventListener('input',render);
  function render(){
    [].forEach.call(cats.children,function(b){b.classList.toggle('on',b.dataset.c===cur)});
    var k=q.value.trim().toLowerCase();
    var rows=DATA.filter(function(d){
      if(cur!=='全部'&&d.category!==cur)return false;
      if(!k)return true;
      return (d.title+' '+d.category+' '+d.summary+' '+(d.keywords||'')).toLowerCase().indexOf(k)>=0;
    });
    count.textContent='共 '+rows.length+' 篇';
    list.innerHTML=rows.length?rows.map(function(d){return '<a class="card" href="'+prefix+esc(d.file)+'"><span class="dia">◆</span><div><div class="meta">'+(d.category?'<span>'+esc(d.category)+'</span>':'')+''+(isNew(d.updated)?'<span class="new">NEW</span>':'')+'</div><h2>'+esc(d.title)+'</h2><p>'+esc(d.summary)+'</p><div class="date">最後更新　'+esc(d.updated)+'</div></div></a>'}).join(''):'<p class="empty">找不到符合的攻略</p>';
  }
  render();
})();
</script>
</body>
</html>
